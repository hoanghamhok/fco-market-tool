name: Publish Windows release

on:
    push:
        branches: [main]
        paths:
            - fco/__init__.py
            - .github/workflows/release.yml
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: windows-release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: windows-2025
        timeout-minutes: 25
        defaults:
            run:
                shell: pwsh
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.13'
                  architecture: x64
                  cache: pip
            - name: Install dependencies
              run: |
                  python -m venv .venv
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  New-Item -ItemType Directory -Path (Join-Path $env:USERPROFILE 'Downloads') -Force | Out-Null
            - name: Run regression tests
              run: |
                  .\.venv\Scripts\python.exe -m unittest discover -s tests -v
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
            - name: Build and verify desktop application
              run: |
                  .\build.bat
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
            - name: Verify packaged update and recovery
              run: |
                  $version = (Get-Content fco/__init__.py -Raw | Select-String '"(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
                  .\.venv\Scripts\python.exe scripts/verify_updater.py "release/FCO-Market-$version.exe"
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
            - name: Publish verified release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  $version = (Get-Content fco/__init__.py -Raw | Select-String '"(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
                  $tag = "v$version"
                  gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
                  if ($LASTEXITCODE -eq 0) {
                    throw "Release $tag already exists. Increase VERSION before publishing another build."
                  }
                  @'
                  Cập nhật FCO Market cho Windows x64.

                  Tải file EXE bên dưới. Người dùng bản trước 4.2.0 cần tải thủ công một lần; từ bản có bộ cập nhật, chọn Kiểm tra cập nhật trong ứng dụng.

                  Dữ liệu và cài đặt được giữ trong thư mục FCO-Market-3-data cạnh EXE.
                  '@ | Set-Content -LiteralPath release/NOTES.md -Encoding utf8
                  gh release create $tag "release/FCO-Market-$version.exe" release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "FCO Market $version" --notes-file release/NOTES.md --draft
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
                  gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
                  if ($LASTEXITCODE) { exit $LASTEXITCODE }
